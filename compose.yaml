services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: squash
      POSTGRES_PASSWORD: squash_dev
      POSTGRES_DB: squash
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squash -d squash"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
